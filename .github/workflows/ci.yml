name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci
      - name: Install Make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --yes --no-progress
          }
      - name: Install PDF inspection tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core libreoffice-writer-nogui ffmpeg
      - name: Check Conventional Commit event policy
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python scripts/release.py check-event
      - name: Verify, build and smoke-test
        env:
          SMOKE_FLAGS: ${{ runner.os == 'Linux' && '--require-poppler' || '' }}
          ANYTOPDF_REQUIRE_OFFICE: ${{ runner.os == 'Linux' && '1' || '' }}
          ANYTOPDF_REQUIRE_FFMPEG: ${{ runner.os == 'Linux' && '1' || '' }}
        run: make ci PYTHON=python

  printer:
    name: Print server (Linux)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: printer
      - name: Install PAPPL and PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y libpappl-dev pkg-config poppler-utils
      - name: Build and print a test page
        run: make printer-smoke PYTHON=python3 WARNINGS="-Wall -Wextra -Wno-unused-parameter -Werror"
      - name: Print over TLS through the remote front
        run: make printer-remote-smoke PYTHON=python3 WARNINGS="-Wall -Wextra -Wno-unused-parameter -Werror"
