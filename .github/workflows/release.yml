name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match tag to Cargo version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import tomllib
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if os.environ['RELEASE_REF'].startswith('refs/tags/'):
              expected = f'v{version}'
              if os.environ['RELEASE_TAG'] != expected:
                  raise SystemExit(f'Release tag must match Cargo.toml: {expected}')
          print(f'Building anytopdf {version}')
          PYTHON

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.target }})
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            no_default_features: '1'
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            no_default_features: '1'
          - runner: macos-14
            target: aarch64-apple-darwin
            no_default_features: '0'
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            no_default_features: '0'
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            no_default_features: '0'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --yes --no-progress
          }
      - name: Install musl and PDF inspection tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools poppler-utils fonts-dejavu-core
      - name: Build, smoke-test and package
        env:
          TARGET: ${{ matrix.target }}
          NO_DEFAULT_FEATURES: ${{ matrix.no_default_features }}
          SMOKE_FLAGS: ${{ runner.os == 'Linux' && '--require-poppler' || '' }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: make package PYTHON=python
      - uses: actions/upload-artifact@v4
        with:
          name: anytopdf-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: anytopdf-*
          merge-multiple: true
          path: dist
      - name: Verify release checksums
        working-directory: dist
        run: |
          cat -- *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --title "anytopdf $RELEASE_TAG" --generate-notes "${options[@]}"
