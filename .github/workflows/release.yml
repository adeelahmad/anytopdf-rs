name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match tag to Cargo version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            python scripts/release.py validate --tag "$RELEASE_TAG"
          else
            python scripts/release.py validate
          fi

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.target }})
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            no_default_features: '1'
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            no_default_features: '1'
          - runner: macos-14
            target: aarch64-apple-darwin
            no_default_features: '0'
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            no_default_features: '0'
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            no_default_features: '0'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --yes --no-progress
          }
      - name: Install musl and PDF inspection tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools poppler-utils fonts-dejavu-core
      - name: Build, smoke-test and package
        env:
          TARGET: ${{ matrix.target }}
          NO_DEFAULT_FEATURES: ${{ matrix.no_default_features }}
          SMOKE_FLAGS: ${{ runner.os == 'Linux' && '--require-poppler' || '' }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: make package PYTHON=python
      - uses: actions/upload-artifact@v4
        with:
          name: anytopdf-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read tagged changelog notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release.py validate --tag "$RELEASE_TAG"
          python scripts/release.py notes > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: anytopdf-*
          merge-multiple: true
          path: dist
      - name: Verify release checksums
        working-directory: dist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          import re

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Invalid release tag for archive inventory')
          version = tag[1:]
          targets = {
              'x86_64-unknown-linux-musl': 'tar.gz',
              'aarch64-unknown-linux-musl': 'tar.gz',
              'aarch64-apple-darwin': 'tar.gz',
              'x86_64-apple-darwin': 'tar.gz',
              'x86_64-pc-windows-msvc': 'zip',
          }
          archives = sorted(f'anytopdf-{version}-{target}.{extension}'
                            for target, extension in targets.items())
          expected = set(archives) | {name + '.sha256' for name in archives}
          actual = {path.name for path in Path('.').iterdir()}
          if actual != expected:
              raise SystemExit(f'Invalid release inventory: missing={sorted(expected - actual)}, extra={sorted(actual - expected)}')
          checksums = []
          for name in archives:
              archive, sidecar = Path(name), Path(name + '.sha256')
              if any(path.is_symlink() or not path.is_file() for path in (archive, sidecar)):
                  raise SystemExit(f'Release asset must be a regular file: {name}')
              line = sidecar.read_text(encoding='utf-8')
              match = re.fullmatch(r'([0-9a-f]{64})  ' + re.escape(name) + r'\n?', line)
              if not match:
                  raise SystemExit(f'Invalid or unsafe checksum sidecar: {sidecar}')
              with archive.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              if digest != match[1]:
                  raise SystemExit(f'Checksum mismatch: {name}')
              checksums.append(f'{digest}  {name}\n')
          Path('SHA256SUMS').write_text(''.join(checksums), encoding='utf-8')
          print('Verified exact five archives and their checksums')
          PYTHON
      - name: Render Homebrew formula and Scoop manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/distribution.py --version "$RELEASE_TAG" --checksums dist/SHA256SUMS --output packaging
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          options=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --title "anytopdf $RELEASE_TAG" --notes-file release-notes.md "${options[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: packaging/*
          if-no-files-found: error

  container:
    name: Container image
    needs: [package, publish]
    if: ${{ !cancelled() && needs.package.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: anytopdf-*-linux-musl
          merge-multiple: true
          path: archives
      - name: Stage the smoke-tested musl binaries
        run: |
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl; do
            arch=${pair%%:*} target=${pair#*:}
            archive=$(find archives -maxdepth 1 -name "anytopdf-*-$target.tar.gz" -print -quit)
            test -n "$archive" || { echo "missing $target archive" >&2; exit 1; }
            (cd archives && sha256sum --check --strict "$(basename "$archive").sha256")
            mkdir -p "dist/docker/$arch"
            tar -xzf "$archive" -C "dist/docker/$arch" --strip-components=1 --wildcards '*/anytopdf'
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Choose image tags
        id: tags
        env:
          PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$PUSH" == true ]]; then
            tags="$image:${RELEASE_TAG#v}"
            if [[ "${RELEASE_TAG%%+*}" != *-* ]]; then
              tags+=",$image:latest"
            fi
          else
            tags="$image:dev"
          fi
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: steps.tags.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: BINARY=prebuilt
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ steps.tags.outputs.push == 'true' }}
