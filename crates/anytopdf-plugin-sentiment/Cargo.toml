[package]
name = "anytopdf-plugin-sentiment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "anytopdf runtime plugin that tags the sentiment and tone of transcript, caption, OCR and document text"
include = ["src/**", "data/**", "Cargo.toml"]

[[bin]]
name = "anytopdf-plugin-sentiment"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
ureq.workspace = true

[dev-dependencies]
anytopdf-core = { path = "../anytopdf-core" }
tempfile.workspace = true
