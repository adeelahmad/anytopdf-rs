[package]
name = "anytopdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Convert media and documents into searchable, RAG-friendly PDFs"
readme = "../../README.md"
keywords = ["pdf", "ocr", "searchable-pdf", "mcp", "rag"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "anytopdf"
path = "src/main.rs"

# cargo-binstall downloads the GitHub release archive built by release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.zip"
pkg-fmt = "zip"

[features]
default = ["apple-vision", "imap"]
apple-vision = ["anytopdf-builtin/apple-vision"]
# `anytopdf watch imap`: fetch mail over IMAP and convert each message.
imap = ["dep:anytopdf-imap"]

[dependencies]
anyhow.workspace = true
anytopdf-core = { path = "../anytopdf-core" }
anytopdf-builtin = { path = "../anytopdf-builtin", default-features = false }
anytopdf-pdf = { path = "../anytopdf-pdf" }
anytopdf-imap = { path = "../anytopdf-imap", optional = true }
anytopdf-print = { path = "../anytopdf-print" }
rustls.workspace = true
clap.workspace = true
regex.workspace = true
serde_json.workspace = true
which.workspace = true
infer.workspace = true
tempfile.workspace = true
base64.workspace = true
hmac.workspace = true
serde.workspace = true
sha2.workspace = true
ureq.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
printpdf.workspace = true
