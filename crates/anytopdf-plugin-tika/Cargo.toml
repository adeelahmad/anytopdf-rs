[package]
name = "anytopdf-plugin-tika"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "anytopdf runtime plugin that imports any format Apache Tika reads, through a Tika server or tika-app jar"
include = ["src/**", "Cargo.toml"]

[[bin]]
name = "anytopdf-plugin-tika"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
ureq.workspace = true

[dev-dependencies]
anytopdf-core = { path = "../anytopdf-core" }
tempfile.workspace = true
