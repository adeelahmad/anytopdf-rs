  conditions: stdout carries --json and extract documents; stderr carries diagnostics, summary, error lines and NDJSON events
  provenance:
    kind: documented
    source: README "Reliability and operation" "diagnostics go to stderr"
- effect: x-unsafe-code
  stance: conditional
