  - provider-adapters
  conditions: 'same-stem .srt/.vtt/.txt/.md next to media; is_file() follows symlinks so the target is read and embedded;
    the operator controls the input layout. Basis: maintainer ruling.'
  tier: security-critical
  false_friend: false
  provenance: *id001
- id: os-sandbox
  components:
  - plugin-host
  - provider-adapters
  - input-importers
  conditions: 'what a plugin or provider process does on the host; not P4 or P5; runtime plugins under --plugin-sandbox strict
    on Linux and macOS are P21. Basis: stated limit.'
  tier: security-critical
  false_friend: true
  provenance:
    kind: documented
    source: PLUGIN_PROTOCOL "without filesystem/network isolation or hard CPU/memory quotas"
- id: capability-filter-as-execution-control
  components:
  - plugin-host
  conditions: 'manifest commands of every discovered plugin still run; only --no-plugins stops execution; under --plugin-sandbox
    strict they run sandboxed (P21). Basis: stated limit.'
  tier: security-critical
  false_friend: true
  provenance:
    kind: documented
    source: PLUGIN_PROTOCOL "manifest commands still run during discovery"
- id: descendant-containment
  components:
  - plugin-host
  - provider-adapters
  conditions: 'by default only the direct child is killed; under --plugin-sandbox contain or strict the tree is killed (P21)
    except a macOS setsid/setpgid descendant or a Windows child created before job assignment; provider descendants never.
    Basis: stated limit.'
  tier: correctness-only
  false_friend: false
  provenance:
    kind: documented
    source: PLUGIN_PROTOCOL "independently spawned descendants are not guaranteed to stop"
- id: untrusted-input-resource-bounds
  components:
  - input-importers
  - provider-adapters
  - pdf-renderer
  - cli-commands
  - cli-extract
  conditions: 'memory, disk and CPU exhaustion from input size or shape, including PDFs passed to extract (maintainer ruling
    2026-10); not P5, P12 or crashes (Q6, P17). Basis: stated limit.'
  tier: security-critical
  false_friend: false
  provenance:
    kind: documented
    source: README "Security and plugins" "size and page caps, zip-bomb rejection" unchecked
- id: archive-profile-privacy
  components:
  - cli-commands
  - pdf-renderer
  conditions: 'default archive profile keeps metadata (GPS, camera, serials) and absolute paths. Basis: stated limit.'
  tier: security-critical
  false_friend: false
  provenance:
    kind: documented
    source: README "`--profile archive|share` (default `archive`) selects metadata detail"
- id: share-profile-content-redaction
  components:
  - cli-commands
  - pdf-renderer
  conditions: 'visible text, OCR, captions, transcripts, base names and SHA-256 stay. Basis: absence.'
  tier: security-critical
  false_friend: true
  provenance:
    kind: documented
    source: 'README "Reliability and operation" describes `share` only as stripping paths and metadata; basis: absence'
- id: output-authenticity
  components:
  - pdf-renderer
  - cli-extract
  - cli-commands
  conditions: 'no signatures; extract does not bind manifest or sidecars to the PDF. Basis: absence.'
  tier: security-critical
  false_friend: true
  provenance:
    kind: documented
    source: 'README "Embedded manifest and chunks" names no signature; basis: absence'
- id: terminal-safe-diagnostics
  components:
  - cli-commands
  conditions: 'human stderr lines print names and messages raw; JSON output is escaped. Basis: absence.'
  tier: correctness-only
  false_friend: false
  provenance:
    kind: documented
    source: 'README "Diagnostics and strict mode" states no escaping; basis: absence'
- id: complex-script-layout
  components:
  - pdf-renderer
  conditions: 'missing glyphs warn. Basis: stated limit.'
  tier: correctness-only
  false_friend: false
  provenance:
    kind: documented
    source: README "Complex text shaping and bidirectional layout are not guaranteed"
- id: cross-file-atomicity
  components:
  - cli-commands
  conditions: 'each file atomic on its own. Basis: stated limit.'
  tier: correctness-only
  false_friend: false
  provenance:
    kind: documented
    source: README "PDF and JSON outputs are separate file transactions"
- id: abnormal-exit-cleanup
  components:
  - cli-commands
  - plugin-host
  conditions: 'no signal handlers. Basis: absence.'
  tier: correctness-only
  false_friend: false
  provenance:
    kind: documented
    source: 'README "Reliability and operation" promises staging, not cleanup; basis: absence'
- id: concurrent-run-coordination
  components:
  - cli-commands
  conditions: 'without --overwrite one run fails; with it the last rename wins. Basis: absence.'
  tier: correctness-only
  false_friend: false
  provenance:
    kind: documented
    source: 'README "Reliability and operation" has no concurrency statement; basis: absence'
- id: untrusted-plugin-safety
  components:
  - plugin-host
  conditions: 'installing a plugin grants it the user''s permissions; --plugin-sandbox strict narrows this to P21''s limits
    on Linux and macOS. Basis: stated limit.'
  tier: security-critical
  false_friend: true
  provenance:
    kind: documented
    source: README "Install only trusted plugins or use `--no-plugins`"
downstream_responsibilities:
- id: R1
  component: plugin-host
  statement: install only trusted plugins; keep plugin search directories trusted; use --no-plugins otherwise, or --plugin-sandbox
    strict on Linux and macOS when they must run
  enforces:
  - install-trusted-plugins
  - trusted-plugin-dirs
  - no-plugins-if-untrusted
  provenance:
    kind: documented
    source: README "Install only trusted plugins or use `--no-plugins`"
- id: R2
  component: input-importers
  statement: convert untrusted media in an OS sandbox with quotas; set non-zero frame caps
  enforces:
  - bound-input-resources
  - set-frame-caps
  - bound-scan-trees
  provenance:
    kind: documented
    source: README "Security and plugins" "size and page caps" unchecked
- id: R3
  component: cli-commands
  statement: use --profile share before sharing outputs; review content for sensitive data yourself
  enforces:
  - use-share-profile
  - manifest-authentic-or-metadata-free
  provenance:
    kind: documented
    source: README "`share` also strips local paths"
- id: R4
  component: cli-extract
  statement: do not treat manifest SHA-256 values as proof a PDF is unaltered; sign and verify externally
  enforces:
  - verify-extract-output
  provenance:
    kind: documented
    source: 'README "Embedded manifest and chunks" names no signature; basis: absence'
- id: R5
  component: cli-commands
  statement: escape text from PDFs, JSON, extract output and stderr before HTML, terminal, shell or database use
  enforces:
  - treat-output-untrusted
  - stderr-terminal-safe
  provenance: *id001
- id: R6
  component: cli-commands
  statement: put outputs outside the directories you scan
  enforces:
  - outputs-outside-inputs
  provenance:
    kind: documented
    source: README "Put outputs outside input directories"
- id: R7
  component: provider-adapters
  statement: keep FFmpeg, ExifTool, Tesseract, Python and docTR from trusted sources
  enforces:
  - trust-providers
  provenance: *id001
- id: R8
  component: provider-adapters
  statement: pre-install docTR weights or use --ocr tesseract/off on offline hosts
  enforces:
  - trust-providers
  provenance:
    kind: documented
    source: README "docTR may download model weights on first use"
- id: R9
  component: cli-commands
  statement: do not run two conversions to the same output at once; clean temp dirs after killed runs
  enforces:
  - concurrent-run-coordination
  - abnormal-exit-cleanup
  provenance:
    kind: documented
    source: 'README "Reliability and operation" has no concurrency or cleanup statement; basis: absence'
- id: R10
  component: cli-extract
  statement: treat extract output as unverified for sidecar origin or version-mismatch warnings
  enforces:
  - verify-extract-output
  - extract-manifest-describes-pdf
  provenance:
    kind: documented
    source: README "adds an `extract.version-mismatch` warning"
- id: R11
  component: pdf-renderer
  statement: treat file base names on the provenance page and in the manifest as attacker-chosen text
  enforces:
  - basenames-trustworthy
  provenance: *id001
- id: R12
  component: plugin-host
  statement: plugin authors treat request content as untrusted, write responses atomically and stay in the workspace
  enforces:
  - trust-plugin-digests
  provenance:
    kind: documented
    source: PLUGIN_PROTOCOL "The plugin must write the response atomically"
known_misuses:
- id: M1
  components:
  - cli-commands
  - input-importers
  pattern: scanning an untrusted tree with defaults, then sharing the PDF
  safer_alternative: --no-plugins, non-zero frame caps, --profile share, inside a sandbox
  provenance:
    kind: documented
    source: README "Reliability and operation" "(default `archive`) selects metadata detail"
- id: M2
  components:
  - plugin-host
  pattern: using --deny-plugin-kind to block an untrusted plugin
  safer_alternative: remove the plugin from the search path or use --no-plugins; --plugin-sandbox strict confines but still
    runs the manifest command
  provenance:
    kind: documented
    source: PLUGIN_PROTOCOL "manifest commands still run during discovery"
- id: M3
  components:
  - cli-extract
  - pdf-renderer
  pattern: treating the manifest as tamper evidence
  safer_alternative: sign the PDF and verify the signature
  provenance:
    kind: documented
    source: 'README "Embedded manifest and chunks" names no signature; basis: absence'
- id: M4
  components:
  - cli-commands
  pattern: writing outputs inside the scanned directory
  safer_alternative: write outputs to a separate directory
  provenance:
    kind: documented
    source: README "Put outputs outside input directories"
- id: M5
  components:
  - cli-commands
  - pdf-renderer
  pattern: treating --profile share as anonymization
  safer_alternative: redact content before conversion
  provenance:
    kind: documented
    source: README "Reliability and operation" describes `share` only as stripping paths and metadata
- id: M6
  components:
  - input-importers
  - plugin-host
  pattern: running untrusted conversions on a shared host with defaults
  safer_alternative: per-job containers with quotas, plus non-zero frame caps, and --no-plugins or --plugin-sandbox strict
  provenance:
    kind: documented
    source: README "These limits are safeguards, not an OS sandbox"
known_non_findings:
- id: KNF-1
  components:
  - plugin-host
  symptom: x-unsandboxed-host-access
  tool_pattern: a runtime plugin can read or write any file, open sockets, or use unlimited CPU and memory
  conditions: actor is an installed anytopdf-plugin-* executable acting through its own process, not its response JSON; no
    P4 or P5 check bypassed; the run did not use --plugin-sandbox strict, or the access is one P21 leaves open
  discharged_by:
  - os-sandbox
  provenance:
    kind: documented
    source: PLUGIN_PROTOCOL "without filesystem/network isolation or hard CPU/memory quotas"
- id: KNF-2
  components:
  - plugin-host
  symptom: x-unexpected-code-execution
  tool_pattern: a plugin whose capability kind is denied still executes
  conditions: --no-plugins not set; the only execution is the --anytopdf-manifest command during discovery
  discharged_by:
  - capability-filter-as-execution-control
  provenance:
    kind: documented
    source: PLUGIN_PROTOCOL "manifest commands still run during discovery"
