  provenance: *id001
- name: third-party-plugins
  scope: out
  reason: installed plugin executables are trusted operator-chosen code (§1.3)
  provenance:
    kind: documented
    source: README "Diagnostics and strict mode" "Install only trusted plugins or use `--no-plugins`"
host_side_effects:
- effect: child-processes
  stance: present
  components:
  - input-importers
  - provider-adapters
  - plugin-host
  conditions: FFmpeg/ffprobe, ExifTool, Tesseract, Python/docTR, provider version probes and runtime plugins; argv without
    a shell
  provenance:
    kind: documented
    source: README "Optional runtime providers"
- effect: filesystem
  stance: present
  components: &id002
  - cli-commands
  - cli-extract
  - input-importers
  - provider-adapters
  - plugin-host
  - pdf-renderer
  conditions: reads inputs, sidecars, transcripts, fonts and extract PDFs; writes the job workspace, staged outputs and created
    parent directories
  provenance:
    kind: documented
    source: README "Writes are staged and atomically published"
- effect: environment-reads
