properties_claimed:
- id: opt-in-plugin-sandbox
  kind: integrity
  components:
  - plugin-host
  tier: security-critical
  conditions: 'under --plugin-sandbox contain or strict every process a plugin starts is killed when its call ends (except
    a macOS descendant calling setsid/setpgid and a Windows child created before job assignment); under strict on Linux and
    macOS writes only to the workspace and /dev/null, no network connections, limited reads; exits 2 where strict cannot
    be enforced; applies to manifest calls; macOS strict allows socket creation and Mach IPC; containment is correctness-only;
    providers and quotas are D1'
  violation_symptoms:
  - x-unsandboxed-host-access
  - hang
  provenance:
    kind: documented
    source: PLUGIN_PROTOCOL "Sandbox levels"
- id: extract-robust-on-hostile-pdf
  kind: correctness
  components:
  - cli-extract
  tier: correctness-only
  conditions: 'any PDF and sibling sidecars: one extract document with exit 0, or exit 3; non-termination on cycles is Q17;
    size exhaustion is D4'
  violation_symptoms:
  - crash
  - wrong-output
  provenance: *id001
- id: no-plugin-execution-when-disabled
  kind: integrity
  components:
  - plugin-host
  - cli-commands
  tier: security-critical
  conditions: --no-plugins is set
  violation_symptoms:
  - x-unexpected-code-execution
  provenance:
    kind: documented
    source: 'PLUGIN_PROTOCOL "`--no-plugins`: bypass runtime discovery entirely"'
- id: inputs-never-overwritten
  kind: integrity
  components:
  - cli-commands
  tier: security-critical
  conditions: every file anytopdf writes (PDFs, --output-dir PDFs, --dump-graph, embed-failure sidecar JSON), even with --overwrite;
    canonical paths; hard links and mid-run changes excluded (Q4)
  violation_symptoms:
  - x-input-overwritten
  provenance:
    kind: documented
    source: README "input files and explicit transcripts are protected even with that flag"
- id: existing-output-not-replaced
  kind: integrity
  components:
  - cli-commands
  tier: correctness-only
  conditions: without --overwrite; every write staged beside the destination and renamed
  violation_symptoms:
  - wrong-output
  provenance:
    kind: documented
    source: README "An explicit existing `-o` requires `--overwrite`"
- id: plugin-response-validation
  kind: integrity
  components:
  - plugin-host
  tier: correctness-only
  conditions: size, regular file, protocol, identities, visual_path containment after symlink resolution, finite and in-range
    numbers; rejected enrichment rolled back
  violation_symptoms:
  - bad-data-accepted
  provenance:
    kind: documented
    source: PLUGIN_PROTOCOL "Host validation and execution policy"
- id: subprocess-time-and-output-bounds
  kind: resource-bound
  components:
  - plugin-host
  - provider-adapters
  - input-importers
  tier: correctness-only
  conditions: each invocation killed at its timeout; captures and responses capped at 16 MiB; total job time not bounded
  violation_symptoms:
  - hang
  - unbounded-allocation
  provenance:
    kind: documented
    source: README "Captured stdout, stderr and plugin response JSON each have a 16 MiB limit"
- id: failed-enrichment-rolls-back
  kind: correctness
  components:
  - plugin-host
  - provider-adapters
  tier: correctness-only
  conditions: source, graph and unit enrichers; plugin side effects are not undone
  violation_symptoms:
  - wrong-output
  provenance:
    kind: documented
    source: ARCHITECTURE "Source, graph and unit enrichers roll back their in-memory changes on failure"
- id: share-profile-path-redaction
  kind: confidentiality
  components:
  - cli-commands
  - pdf-renderer
  tier: security-critical
  conditions: --profile share; paths and metadata only, not text content (D6)
  violation_symptoms:
  - info-leak
  provenance:
