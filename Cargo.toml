[workspace]
resolver = "2"
members = [
  "crates/anytopdf-core",
  "crates/anytopdf-builtin",
  "crates/anytopdf-pdf",
  "crates/anytopdf-cli",
  "crates/anytopdf-imap",
  "crates/anytopdf-index",
  "crates/anytopdf-onnx",
  "crates/anytopdf-plugin-objects",
  "crates/anytopdf-plugin-vlm",
  "crates/anytopdf-plugin-whisper",
  "crates/anytopdf-print",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["anytopdf contributors"]
repository = "https://github.com/adeelahmad/anytopdf-rs"
homepage = "https://github.com/adeelahmad/anytopdf-rs"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = [
  "png", "jpeg", "gif", "webp", "bmp", "tiff"
] }
infer = "0.22"
libc = "0.2"
lopdf = { version = "0.44", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
mail-parser = { version = "0.11", default-features = false }
tiff = { version = "0.11", default-features = false, features = ["deflate", "fax", "jpeg", "lzw"] }
printpdf = { version = "0.12.8", default-features = false, features = [
  "png", "jpeg", "gif", "bmp", "tiff", "webp"
] }
prost = { version = "0.14", default-features = false, features = ["std", "derive"] }
regex = "1.11"
# Bundled SQLite with FTS5 for the cross-file search index.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
sha1 = "0.11"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
uuid = { version = "1.18", features = ["v4", "v7", "v8", "serde"] }
walkdir = "2.5"
which = "8.0"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects",
  "Win32_System_Threading"
] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ttf-parser = "0.25"
tract-onnx = { version = "0.23", default-features = false }
imap = { version = "=3.0.0-alpha.15", default-features = false }
rustls-native-certs = "0.8"
base64 = "0.22"
hmac = "0.13"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
base64ct = { version = "1.6", features = ["alloc"] }
mdns-sd = { version = "0.21", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
unicode-bidi = "0.3.18"
krilla = { version = "0.8.2", default-features = false, features = ["raster-images", "simple-text"] }
allsorts = { package = "allsorts-azul", version = "0.17.2", default-features = false, features = ["flate2_rust"] }

[profile.release]
lto = true
strip = true
